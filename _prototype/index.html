<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440, initial-scale=1" />
<title>DeepHire — Candidate Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1EEE6;
    --paper: #FAF8F3;
    --paper-2: #F6F3EC;
    --ink: #161510;
    --ink-2: #3A3832;
    --muted: #8A877D;
    --muted-2: #B5B1A5;
    --rule: #D9D4C5;
    --rule-soft: #E7E2D3;
    --accent: #B43A2E;       /* oxidized red */
    --accent-soft: #F2D7D2;
    --positive: #2F6B3F;
    --positive-soft: #DCE7DC;
    --amber: #A06B0F;
    --amber-soft: #F1E1B8;
    --indigo: #2E3A6B;
    --indigo-soft: #DBDFEC;

    --serif: "Instrument Serif", "Times New Roman", serif;
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;

    --r-sm: 4px;
    --r-md: 8px;
    --r-lg: 12px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
  }

  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  input:focus, textarea:focus, select:focus, button:focus { outline: none; }

  ::selection { background: var(--ink); color: var(--paper); }

  /* App shell */
  .app {
    display: grid;
    grid-template-columns: var(--sidebar, 248px) 1fr;
    min-height: 100vh;
    transition: grid-template-columns 220ms cubic-bezier(.2,.7,.2,1);
  }
  .app.collapsed { --sidebar: 64px; }

  /* Sidebar */
  .sidebar {
    border-right: 1px solid var(--rule);
    background: var(--paper-2);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--ink); color: var(--paper);
    display: grid; place-items: center;
    font-family: var(--serif); font-size: 22px; line-height: 1;
    font-style: italic;
    flex-shrink: 0;
  }
  .brand-name {
    font-family: var(--serif); font-size: 22px; line-height: 1;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .brand-sub {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.14em; text-transform: uppercase;
    margin-top: 3px;
    white-space: nowrap;
  }
  .collapsed .brand-text { display: none; }

  .nav { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-section {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 14px 10px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: var(--r-sm);
    color: var(--ink-2);
    cursor: pointer;
    border: 1px solid transparent;
    user-select: none;
    transition: background 120ms, color 120ms;
  }
  .nav-item:hover { background: rgba(0,0,0,0.03); color: var(--ink); }
  .nav-item.active {
    background: var(--paper);
    border-color: var(--rule);
    color: var(--ink);
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  .nav-item .ico { width: 16px; height: 16px; flex-shrink: 0; color: var(--ink-2); }
  .nav-item.active .ico { color: var(--ink); }
  .nav-item .label { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .nav-item .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 999px;
    border: 1px solid var(--rule);
  }
  .collapsed .nav-item .label,
  .collapsed .nav-item .count,
  .collapsed .nav-section { display: none; }
  .collapsed .nav-item { justify-content: center; padding: 8px; }

  .sidebar-foot {
    margin-top: auto;
    padding: 14px;
    border-top: 1px solid var(--rule);
  }
  .user-card {
    display: flex; align-items: center; gap: 10px;
    padding: 6px;
    border-radius: var(--r-sm);
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 500;
    flex-shrink: 0;
  }
  .user-card .meta { display: flex; flex-direction: column; min-width: 0; }
  .user-card .name { font-size: 13px; font-weight: 500; }
  .user-card .email { font-size: 11px; color: var(--muted); }
  .collapsed .user-card .meta { display: none; }

  .collapse-toggle {
    position: absolute;
    top: 22px;
    right: -10px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--rule);
    display: grid; place-items: center;
    color: var(--ink-2);
    z-index: 2;
  }
  .collapse-toggle:hover { color: var(--ink); }

  /* Main */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 56px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    display: flex; align-items: center;
    padding: 0 28px;
    gap: 14px;
    position: sticky; top: 0; z-index: 10;
  }
  .breadcrumb {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
  }
  .breadcrumb .sep { opacity: 0.5; }
  .breadcrumb .here { color: var(--ink); }
  .topbar .spacer { flex: 1; }
  .topbar .right { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: var(--paper-2);
    font-size: 12px;
    color: var(--ink-2);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--positive); }

  .content { padding: 32px 40px 80px; max-width: 1280px; width: 100%; }
  .content.full { max-width: none; }

  /* Page headers */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; gap: 24px; flex-wrap: wrap; }
  .page-eyebrow {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .page-title {
    font-family: var(--serif);
    font-size: 46px;
    line-height: 1.02;
    letter-spacing: -0.015em;
    font-weight: 400;
    margin: 0;
  }
  .page-title em { font-style: italic; color: var(--ink-2); }
  .page-sub { color: var(--muted); margin-top: 8px; max-width: 56ch; }

  /* Card */
  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--r-lg);
  }
  .card-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .card-title { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
  .card-sub { font-size: 12px; color: var(--muted); }
  .card-body { padding: 20px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    height: 36px;
    padding: 0 14px;
    border-radius: var(--r-md);
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 120ms, border-color 120ms, transform 120ms;
  }
  .btn:hover { background: var(--paper-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  .btn.primary:hover { background: #000; }
  .btn.accent {
    background: var(--accent); color: var(--paper); border-color: var(--accent);
  }
  .btn.ghost { background: transparent; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
  .btn[disabled] { opacity: 0.55; cursor: not-allowed; }

  /* Inputs */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label {
    font-size: 12px; font-weight: 500; color: var(--ink-2);
    display: flex; align-items: center; gap: 8px;
  }
  .field-label .opt { font-weight: 400; color: var(--muted); font-size: 11px; }
  .field-hint { font-size: 11px; color: var(--muted); }
  .input, .textarea, .select {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--r-md);
    padding: 10px 12px;
    font-size: 13px;
    color: var(--ink);
    transition: border-color 120ms, box-shadow 120ms;
  }
  .input:focus, .textarea:focus, .select:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(22,21,16,0.08);
  }
  .textarea { resize: vertical; min-height: 120px; font-family: inherit; line-height: 1.55; }
  .input-prefix {
    display: flex; align-items: center;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--r-md);
    overflow: hidden;
  }
  .input-prefix:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(22,21,16,0.08); }
  .input-prefix .pfx {
    padding: 0 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    border-right: 1px solid var(--rule);
    height: 38px;
    display: grid; place-items: center;
    background: var(--paper-2);
  }
  .input-prefix .input {
    border: none; border-radius: 0;
  }
  .input-prefix .input:focus { box-shadow: none; }

  /* Badge */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
    font-weight: 500;
    letter-spacing: 0.02em;
    background: var(--bg);
    border: 1px solid var(--rule);
    color: var(--ink-2);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge.positive { background: var(--positive-soft); border-color: #B6CFB6; color: var(--positive); }
  .badge.warn { background: var(--amber-soft); border-color: #DBC487; color: var(--amber); }
  .badge.danger { background: var(--accent-soft); border-color: #E0B5AE; color: var(--accent); }
  .badge.indigo { background: var(--indigo-soft); border-color: #BAC1D6; color: var(--indigo); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Progress */
  .prog {
    width: 100%;
    height: 6px;
    background: var(--rule-soft);
    border-radius: 999px;
    overflow: hidden;
  }
  .prog > span {
    display: block;
    height: 100%;
    background: var(--ink);
    border-radius: inherit;
    transition: width 400ms cubic-bezier(.2,.7,.2,1);
  }
  .prog.accent > span { background: var(--accent); }
  .prog.positive > span { background: var(--positive); }
  .prog.amber > span { background: var(--amber); }

  /* Mono kbd */
  .kbd {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-bottom-width: 2px;
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--ink-2);
  }

  /* Tabular numerals */
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* Score block (instrument style) */
  .score-card {
    padding: 22px 20px 18px;
    border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 10px;
    position: relative;
  }
  .score-card:last-child { border-right: none; }
  .score-eyebrow {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.18em; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
  }
  .score-value {
    font-family: var(--serif);
    font-size: 56px;
    line-height: 0.95;
    letter-spacing: -0.02em;
    display: flex; align-items: baseline; gap: 6px;
    white-space: nowrap;
  }
  .score-value .over {
    font-size: 18px; color: var(--muted);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .score-delta {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .score-delta.up { color: var(--positive); }
  .score-delta.down { color: var(--accent); }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 800ms linear infinite; transform-origin: center; }

  /* Pulse dot */
  @keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 currentColor; } 50% { box-shadow: 0 0 0 6px rgba(0,0,0,0); } }
  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    animation: pulseDot 1.6s ease-out infinite;
  }

  /* Table */
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th, .tbl td {
    text-align: left; padding: 12px 16px;
    border-bottom: 1px solid var(--rule-soft);
    font-size: 13px;
    vertical-align: middle;
  }
  .tbl th {
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--paper-2);
    border-bottom: 1px solid var(--rule);
  }
  .tbl tr.row { cursor: pointer; transition: background 120ms; }
  .tbl tr.row:hover td { background: var(--paper-2); }
  .tbl tr:last-child td { border-bottom: none; }

  /* Sheet (slide-out) */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(20,18,12,0.36);
    backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity 220ms ease;
    z-index: 50;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 560px; max-width: 92vw;
    background: var(--paper);
    border-left: 1px solid var(--rule);
    transform: translateX(100%);
    transition: transform 280ms cubic-bezier(.2,.7,.2,1);
    z-index: 60;
    display: flex; flex-direction: column;
    box-shadow: -24px 0 80px -32px rgba(0,0,0,0.18);
  }
  .sheet.open { transform: translateX(0); }
  .sheet-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .sheet-body { padding: 22px; overflow: auto; flex: 1; }

  /* Alert */
  .alert {
    display: flex; gap: 12px;
    padding: 14px 16px;
    border-radius: var(--r-md);
    border: 1px solid var(--rule);
    background: var(--paper);
  }
  .alert.danger { background: var(--accent-soft); border-color: #E5BCB4; }
  .alert.danger .alert-title { color: var(--accent); }
  .alert.warn { background: var(--amber-soft); border-color: #D9C18B; }
  .alert.warn .alert-title { color: var(--amber); }
  .alert .ico { flex-shrink: 0; margin-top: 1px; }
  .alert .alert-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .alert .alert-body { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }

  /* Hairline grid pattern for the dossier feel */
  .grain {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.025) 1px, transparent 0);
    background-size: 16px 16px;
  }

  /* Step indicator */
  .step {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-radius: var(--r-md);
    background: var(--paper-2);
    border: 1px solid var(--rule-soft);
  }
  .step.active { background: var(--paper); border-color: var(--rule); }
  .step .num {
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--bg); color: var(--muted);
    border: 1px solid var(--rule);
    font-size: 11px;
  }
  .step.active .num { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .step.done .num { background: var(--positive); color: var(--paper); border-color: var(--positive); }
  .step .lbl { font-size: 12px; }
  .step .sub { font-size: 11px; color: var(--muted); }

  /* Misc */
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .rule { height: 1px; background: var(--rule-soft); margin: 14px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .xs { font-size: 11px; }
  .mono { font-family: var(--mono); }
  .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Evidence grid */
  .evidence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Image placeholder */
  .img-ph {
    background:
      repeating-linear-gradient(135deg, var(--paper-2) 0 6px, var(--paper) 6px 12px);
    border: 1px solid var(--rule);
    border-radius: var(--r-md);
    display: grid; place-items: center;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  /* Animation entry */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 320ms cubic-bezier(.2,.7,.2,1) both; }

  /* Marquee for streaming logs */
  .log-line {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
    padding: 4px 0;
    display: flex; gap: 10px; align-items: baseline;
    border-bottom: 1px dashed var(--rule-soft);
  }
  .log-line:last-child { border-bottom: none; }
  .log-line .t { color: var(--muted); font-size: 10.5px; min-width: 56px; }
  .log-line .src {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); min-width: 90px;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="src/bundle.jsx"></script>

</body>
</html>
